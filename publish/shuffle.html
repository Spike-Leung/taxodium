<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隨機</title>
    <meta name="author" content="Spike Leung" />
    <meta name="description" content="Shuffle page of taxodium.ink" />
    <meta name="generator" content="Org Mode" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/styles/main.css" type="text/css"/>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="/js/color-scheme.js"></script>
    <style>
     main {
       display: flex;
       place-content: center;
       margin-block-start: 45vh;
     }

     .loading-placeholder {
       &::before {
         content: '';
         animation: kaomoji infinite 2s alternate;
       }
     }

     @keyframes kaomoji {
       0%,
       50% {
         content: '(*/ω＼) 給你看哪篇好呢...';
       }

       100% {
         content: '(・・?) 讓我再想想...';
       }
     }
    </style>
  </head>
  <body>
    <main>
      <span class="loading-placeholder"></span>
      <noscript>
        隨機功能需要 JavaScript，如果你要使用請允許 JS 運行。
      </noscript>
    </main>
    <script>
     fetch('/shuffle.data.json')
       .then(res => res.json())
       .then(pages => {
         const randomIndex = Math.floor(Math.random() * pages.length);
         const page = pages[randomIndex];
         location.replace(`/${page}`);
       });
    </script>
  </body>
</html>
