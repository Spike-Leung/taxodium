<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search</title>
    <meta name="author" content="Spike Leung" />
    <meta name="description" content="search page of taxodium.ink" />
    <meta name="generator" content="Org Mode" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css" type="text/css"/>
    <link rel="stylesheet" href="/fonts/LXGWWenKai/LXGWWenKai-Regular/result.css" />
    <link rel="stylesheet" href="/fonts/LXGWWenKai/LXGWWenKai-Medium/result.css" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="/js/color-scheme.js"></script>
    <script src="/pagefind/pagefind-ui.js"></script>
    <style>
      .search-container {
        position: relative;
      }
      #search {
        margin-block-start: 1em;
      }
      #help-content {
        color: var(--color-text);
        color: light-dark(var(--color-text), var(--dark-color-text));
        background-color: var(--color-bg-src-block);
        background-color: light-dark(var(--color-bg-src-block), var(--dark-color-bg-src-block));
        border-color: var(--color-border);
        border-color: light-dark(var(--color-border), var(--dark-color-border));
        border-radius: .25em;
        padding: 0 1em;
        /* Final state of the exit animation */
        opacity: 0;
        transition: all 0.5s allow-discrete;

        @media screen and (max-width: 1000px) {
          margin-inline: 1em;
        }

        &:popover-open {
          opacity: 1;
        }

        /* Needs to be after the previous [popover]:popover-open rule
 to take effect, as the specificity is the same */
        @starting-style {
          &:popover-open {
            opacity: 0;
          }
        }

        &::backdrop {
          backdrop-filter: none;
          transition: all 0.3s allow-discrete;
          pointer-events: none;
        }

        &:popover-open::backdrop {
          backdrop-filter: blur(15px);
        }

        /* The nesting selector (&) cannot represent pseudo-elements
 so this starting-style rule cannot be nested */
        @starting-style {
          &:popover-open::backdrop {
            backdrop-filter: none;
          }
        }
      }

      /* https://stackoverflow.com/questions/78995412/how-to-stop-mouse-events-through-css-backdrop */
      /* filter element not supposed to catch mouse events */
      body:has(:popover-open) * {
        pointer-events: none;
      }

      /* then allow click from #mypopover */
      div[popover] * {
        pointer-events: auto;
      }

      .help-tip {
        color: var(--color-text-secondary);
        color: light-dark(var(--color-text-secondary), var(--dark-color-text-secondary));
      }
    </style>
  </head>
  <body>
    <div id="preamble" class="status">
      <nav>
        <ul>
          <li><a href="/index.html">主页</a></li>
          <li><a href="/subscribe.html">订阅</a></li>
          <li><a href="/search.html">搜索</a></li>
          <li><a href="/inside-black-hole.html">黑洞里</a></li>
        </ul>
        <span class="snow-toggle-container">
          <input type="checkbox" id="snow-toggle" aria-label="切换雪花效果" checked>
          <label for="snow-toggle" class="snow-icon"></label>
        </span>
        <select onchange="switchMode(this.value)" id="lightdark" class="js-required">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="dark-retro" aria-lable="复古 Dark">Dark 👾</option>
        </select>
      </nav>
    </div>
    <div class="search-container">
      <p class="help-tip">
        搜索通过 <a href="https://pagefind.app/">pagefind</a> 实现。
        如果你未启用 JavaScript，也可以使用你喜欢的搜索引擎进行搜索。
        例如：<a href="https://kagi.com/search?q=site%3Ataxodium.ink">Kagi</a>、<a href="https://www.google.com/search?q=site%3Ataxodium.ink">Google</a>。
        <button popovertarget="help-content" class="help-trigger js-required">pagefind 搜索技巧</button>
      </p>
      <div id="search" autofocus></div>
      <div id="help-content" popover>
        <p>
          受限于 pagefind 对中文的分词处理，当你搜索 <code>订阅流</code> 的时候可能无法完全匹配 <code>订阅流</code>，
        </p>
        <p>
          你可以使用<mark>空格分隔</mark>，将其拆分成 <code>订阅 流</code> 搜索，这样会同时匹配包含 <code>订阅</code> 和 <code>流</code>的内容。
        </p>
        <p>更多见: <a href="https://pagefind.app/docs/multilingual/#specialized-languages">Specialized languages</a></p>
      </div>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', (event) => {
        new PagefindUI({
          element: "#search",
          showSubResults: true,
          showImages: false,
          autofocus: true,
          excerptLength: 50,
        });
      });
    </script>
    <script src="/js/backtop.js" defer=""></script>
    <script src="/js/snow-fall.js" defer type="module"></script>
    <snow-fall></snow-fall>
    <noscript>
      <style>
        .js-required {
          display: none;
        }
      </style>
    </noscript>
  </body>
</html>
